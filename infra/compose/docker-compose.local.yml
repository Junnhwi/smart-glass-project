services:
  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smart_glass
      POSTGRES_USER: rag_service
      POSTGRES_PASSWORD: rag_service
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  inference-worker:
    build:
      context: ../..
      dockerfile: infra/docker/inference-server.Dockerfile
    env_file:
      - ../../.env
    depends_on:
      - redis
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - AWS_REGION=ap-northeast-2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  inference-api:
    build:
      context: ../..
      dockerfile: infra/docker/inference-server.Dockerfile
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - ../../.env
    depends_on:
      - redis
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - AWS_REGION=ap-northeast-2
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "/app/scripts/http_healthcheck.py",
          "http://127.0.0.1:8000/health/ready"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  rag-service:
    build:
      context: ../..
      dockerfile: infra/docker/rag-service.Dockerfile
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8000"
    environment:
      - RAG_STORAGE_BACKEND=postgres
      - RAG_DATABASE_URL=postgresql://rag_service:rag_service@postgres:5432/smart_glass
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready').read()"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  hf-cache:
  postgres-data:
