services:
  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  inference-worker:
    build:
      context: ../..
      dockerfile: infra/docker/inference-server.Dockerfile
    env_file:
      - ../../.env
    depends_on:
      - redis
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - AWS_REGION=ap-northeast-2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  inference-api:
    build:
      context: ../..
      dockerfile: infra/docker/inference-server.Dockerfile
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - ../../.env
    depends_on:
      - redis
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - AWS_REGION=ap-northeast-2
    ports:
      - "8000:8000"
