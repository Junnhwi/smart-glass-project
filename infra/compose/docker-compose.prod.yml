services:
  object-storage-smoke:
    build:
      context: ../..
      dockerfile: infra/docker/api-server.Dockerfile
    restart: "no"
    env_file:
      - ../../.env
    environment:
      STORAGE_REGION: ${STORAGE_REGION:-kr-standard}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-https://kr.object.ncloudstorage.com}
      STORAGE_ADDRESSING_STYLE: ${STORAGE_ADDRESSING_STYLE:-path}
    command:
      [
        "python",
        "-c",
        "import os; import boto3; from botocore.config import Config; bucket=os.environ['STORAGE_BUCKET_NAME']; client=boto3.client('s3', aws_access_key_id=os.environ['STORAGE_ACCESS_KEY_ID'], aws_secret_access_key=os.environ['STORAGE_SECRET_ACCESS_KEY'], region_name=os.getenv('STORAGE_REGION','kr-standard'), endpoint_url=os.getenv('STORAGE_ENDPOINT_URL'), config=Config(s3={'addressing_style': os.getenv('STORAGE_ADDRESSING_STYLE','path')})); client.head_bucket(Bucket=bucket); print(f'object storage ok: {bucket}')"
      ]

  ollama-cloud-config-smoke:
    image: python:3.12-slim
    restart: "no"
    env_file:
      - ../../.env
    environment:
      API_LLM_PROVIDER: ollama
      API_LLM_OLLAMA_BASE_URL: ${API_LLM_OLLAMA_BASE_URL:-https://ollama.com/api}
      API_LLM_OLLAMA_MODEL: ${API_LLM_OLLAMA_MODEL:-gpt-oss:20b-cloud}
      OLLAMA_VLM_MODEL: ${OLLAMA_VLM_MODEL:-gemma3:12b}
    command:
      [
        "python",
        "-c",
        "import os; missing=[name for name in ('API_LLM_OLLAMA_API_KEY',) if not os.getenv(name)]; assert not missing, 'missing required env: '+', '.join(missing); print('ollama cloud config ok:', os.getenv('API_LLM_OLLAMA_BASE_URL'), 'llm=', os.getenv('API_LLM_OLLAMA_MODEL'), 'vlm=', os.getenv('OLLAMA_VLM_MODEL'))"
      ]

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_glass
      POSTGRES_USER: api_server
      POSTGRES_PASSWORD: api_server
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  admin-bootstrap:
    build:
      context: ../..
      dockerfile: infra/docker/api-server.Dockerfile
    restart: "no"
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      API_CAPTURE_DATABASE_URL: postgresql://api_server:api_server@postgres:5432/smart_glass
    command: ["python", "/app/scripts/bootstrap_admin.py"]

  inference-worker:
    build:
      context: ../..
      dockerfile: infra/docker/inference-worker-cloud.Dockerfile
    command:
      [
        "sh",
        "-c",
        "celery -A src.queue.tasks --result-backend \"$${CELERY_RESULT_BACKEND}\" worker --loglevel=info -P solo"
      ]
    restart: unless-stopped
    env_file:
      - ../../.env
    depends_on:
      object-storage-smoke:
        condition: service_completed_successfully
      ollama-cloud-config-smoke:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      STORAGE_REGION: ${STORAGE_REGION:-kr-standard}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-https://kr.object.ncloudstorage.com}
      STORAGE_ADDRESSING_STYLE: ${STORAGE_ADDRESSING_STYLE:-path}
      VISION_USE_OLLAMA: "1"
      VISION_CAPTION_MODEL: blip-base
      VISION_CAPTION_QUANTIZATION: none
      VISION_CAPTION_DTYPE: float16
      VISION_TASK_SOFT_TIME_LIMIT_SEC: ${VISION_TASK_SOFT_TIME_LIMIT_SEC:-180}
      VISION_TASK_HARD_TIME_LIMIT_SEC: ${VISION_TASK_HARD_TIME_LIMIT_SEC:-240}
      VISION_TASK_MAX_RETRIES: ${VISION_TASK_MAX_RETRIES:-2}
      VISION_TASK_RETRY_DELAY_SEC: ${VISION_TASK_RETRY_DELAY_SEC:-10}
      API_LLM_OLLAMA_BASE_URL: ${API_LLM_OLLAMA_BASE_URL:-https://ollama.com/api}
      API_LLM_OLLAMA_TIMEOUT_SEC: ${API_LLM_OLLAMA_TIMEOUT_SEC:-60}
      OLLAMA_VLM_MODEL: ${OLLAMA_VLM_MODEL:-gemma3:12b}
      INFERENCE_WORKER_PRELOAD_ON_STARTUP: "0"
      INFERENCE_STORAGE_READINESS_MODE: ${INFERENCE_STORAGE_READINESS_MODE:-config}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "/app/scripts/worker_healthcheck.py"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  api-server:
    build:
      context: ../..
      dockerfile: infra/docker/api-server.Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    depends_on:
      object-storage-smoke:
        condition: service_completed_successfully
      ollama-cloud-config-smoke:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      admin-bootstrap:
        condition: service_completed_successfully
      inference-worker:
        condition: service_healthy
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      API_CAPTURE_ENABLE_MEMORY_STORE: "1"
      API_CAPTURE_DATABASE_URL: postgresql://api_server:api_server@postgres:5432/smart_glass
      API_MEMORY_DEFAULT_TOP_K: ${API_MEMORY_DEFAULT_TOP_K:-5}
      API_CAPTURE_WORKER_TIMEOUT_SEC: ${API_CAPTURE_WORKER_TIMEOUT_SEC:-180}
      API_LLM_PROVIDER: ollama
      API_LLM_OLLAMA_BASE_URL: ${API_LLM_OLLAMA_BASE_URL:-https://ollama.com/api}
      API_LLM_OLLAMA_MODEL: ${API_LLM_OLLAMA_MODEL:-gpt-oss:20b-cloud}
      API_LLM_OLLAMA_TIMEOUT_SEC: ${API_LLM_OLLAMA_TIMEOUT_SEC:-60}
      STORAGE_REGION: ${STORAGE_REGION:-kr-standard}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-https://kr.object.ncloudstorage.com}
      STORAGE_ADDRESSING_STYLE: ${STORAGE_ADDRESSING_STYLE:-path}
    ports:
      - "8002:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready').read()"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  admin-web:
    build:
      context: ../..
      dockerfile: infra/docker/admin-web.Dockerfile
    restart: unless-stopped
    depends_on:
      api-server:
        condition: service_healthy
    ports:
      - "${ADMIN_WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:
